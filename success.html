<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido confirmado · INSTINCT</title><link rel="stylesheet" href="styles.css"></head><body class="infoBody"><header><a class="brand" href="/">INSTINCT<small>MEN · INTIMATES · LIFESTYLE</small></a></header><main class="infoPage"><p class="eyebrow dark">INSTINCT / ORDER</p><h1>Pedido recebido.</h1><p class="lead">Obrigado pela sua compra. O pagamento foi enviado com segurança e seu pedido seguirá para processamento.</p><div id="orderBox" class="policyCard"><strong>Confirmando pagamento…</strong></div><div class="infoActions"><a class="cta darkCta" href="/">VOLTAR À LOJA</a><a class="textLink" href="/info.html#delivery">Ver informações de entrega</a></div></main><script>const p=new URLSearchParams(location.search),id=p.get('session_id');localStorage.removeItem('instinctCart');if(id)fetch('/api/order?session_id='+encodeURIComponent(id)).then(r=>r.json()).then(o=>{document.getElementById('orderBox').innerHTML=o.paid?`<strong>Pagamento confirmado ✓</strong><p>Referência: ${o.reference}</p><p>Total: ${new Intl.NumberFormat('pt-PT',{style:'currency',currency:(o.currency||'eur').toUpperCase()}).format((o.amount||0)/100)}</p>${o.customer?`<p>Confirmação: ${o.customer}</p>`:''}`:'<strong>Pagamento em processamento.</strong><p>Você pode fechar esta página com segurança.</p>'}).catch(()=>document.getElementById('orderBox').innerHTML='<strong>Pedido recebido.</strong><p>Consulte a confirmação do pagamento enviada pelo processador.</p>');</script></body></html>
